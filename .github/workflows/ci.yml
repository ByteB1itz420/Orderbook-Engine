name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (ASan + UBSan)
        run: cmake -B build-san -DCMAKE_BUILD_TYPE=Debug -DLOB_SANITIZERS=ON
      - name: Build
        run: cmake --build build-san -j
      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Configure with clang-tidy
        run: cmake -B build-tidy -DCMAKE_CXX_CLANG_TIDY=clang-tidy
      - name: Build (runs clang-tidy)
        run: cmake --build build-tidy -j
